<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf8f4">
<meta name="description" content="Dashboard tugas dan reward digital.">
<title>Masuk</title>
<link rel="stylesheet" href="./style.css">
<script>window.turnstileReady = function(){ window.dispatchEvent(new Event("turnstile-ready")); };</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=turnstileReady&render=explicit" async defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-banner">
      <div class="auth-symbol" aria-hidden="true">＋</div>
      <h1 id="authHeading">Daftar Akun</h1>
      <p id="authSubheading">Buat akun untuk mulai mendapatkan reward</p>
    </div>
    <div class="auth-content">
      <div class="field wide"><span>Verifikasi keamanan</span><div id="captchaWidget" aria-label="Verifikasi Saya bukan robot"></div><p class="hint">Selesaikan CAPTCHA asli sebelum login atau daftar.</p></div>
      <div id="authNotice" class="inline-message hidden" role="status"></div>
      <form id="registerForm" class="form-stack">
        <label class="field"><span>Username</span><input id="registerUsername" name="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="Buat username" required><small>3–24 karakter, huruf, angka, atau underscore.</small></label>
        <label class="field"><span>Email aktif</span><input id="registerEmail" name="email" type="email" autocomplete="email" maxlength="254" placeholder="nama@email.com" required></label>
        <label class="field"><span>Kode referral (opsional)</span><input id="registerReferral" name="referralCode" maxlength="24" autocomplete="off" placeholder="Masukkan kode teman jika ada"></label>
        <label class="field"><span>Password</span><input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Minimal 8 karakter" required></label>
        <label class="field"><span>Konfirmasi Password</span><input id="registerConfirm" name="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Ulangi password" required></label>
        <button class="button button-primary full" type="submit">Daftar</button>
      </form>
      <form id="loginForm" class="form-stack hidden">
        <label class="field"><span>Email</span><input id="loginEmail" name="email" type="text" inputmode="email" autocomplete="username" placeholder="Email kamu (akun lama bisa pakai username)" required></label>
        <label class="field"><span>Password</span><input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Password" required></label>
        <button class="button button-primary full" type="submit">Login</button>
      </form>
      <form id="verifyForm" class="form-stack hidden">
        <label class="field"><span>Email untuk verifikasi</span><input id="verifyEmail" name="email" type="email" autocomplete="email" required></label>
        <label class="field"><span>Kode verifikasi</span><input id="verifyCode" name="code" inputmode="numeric" pattern="[0-9]{6,8}" minlength="6" maxlength="8" autocomplete="one-time-code" placeholder="Masukkan kode dari email" required></label>
        <button class="button button-primary full" type="submit">Verifikasi email</button>
        <button id="resendCode" class="button button-soft full" type="button">Kirim ulang kode</button>
      </form>
      <p class="auth-switch"><span id="authSwitchText">Sudah punya akun?</span> <button id="switchAuth" class="text-button" type="button">Login</button></p>
      <p id="openVerifyWrap" class="auth-switch"><button id="openVerify" class="text-button" type="button">Sudah daftar? Lanjut verifikasi email</button></p>
    </div>
  </div>
</section>

<section id="appScreen" class="app-screen hidden">
  <header class="app-header">
    <button id="menuButton" class="icon-button" type="button" aria-label="Buka menu" aria-expanded="false"><span class="hamburger"><i></i><i></i><i></i></span></button>
    <div class="header-balance"><small>Saldo tersedia</small><strong id="headerBalance">Rp0</strong></div>
    <div class="header-profile"><span id="headerAvatar" class="avatar">U</span><span id="headerUsername">User</span></div>
    <button id="logoutButton" class="icon-button logout-icon" type="button" aria-label="Keluar">↗</button>
  </header>
  <div id="drawerShade" class="drawer-shade hidden"></div>
  <aside id="navDrawer" class="nav-drawer" aria-label="Menu utama">
    <div class="drawer-head"><span class="drawer-caption">MENU</span><button id="closeMenu" class="icon-button" type="button" aria-label="Tutup menu">×</button></div>
    <div class="drawer-group"><span class="drawer-group-label">UTAMA</span>
      <button class="nav-link active" data-view="dashboard" type="button"><span>⌂</span>Dashboard</button>
      <button class="nav-link" data-view="history" type="button"><span>↺</span>Riwayat</button>
      <button class="nav-link" data-view="withdraw" type="button"><span>⇧</span>Withdraw</button>
      <button class="nav-link" data-view="referral" type="button"><span>♧</span>Referral</button>
      <button class="nav-link" data-view="chat" type="button"><span>☷</span>Global Chat</button>
    </div>
    <div id="adminNav" class="drawer-group hidden"><span class="drawer-group-label">ADMIN</span>
      <button class="nav-link" data-view="maintenance" type="button"><span>⚙</span>Maintenance Menu</button>
      <button class="nav-link" data-view="requests" type="button"><span>⇄</span>Request Withdraw <b id="pendingBadge" class="nav-badge hidden">0</b></button>
      <button class="nav-link" data-view="codes" type="button"><span>◇</span>Create Unickcode</button>
      <button class="nav-link" data-view="create-job" type="button"><span>＋</span>Create Job</button>
      <button class="nav-link" data-view="review-jobs" type="button"><span>✓</span>Review Job</button>
      <button class="nav-link" data-view="payout-settings" type="button"><span>◎</span>Setting UATS</button>
    </div>
    <div class="drawer-foot"><span id="drawerRole">Pengguna</span><button id="drawerLogout" class="nav-link" type="button"><span>↗</span>Keluar akun</button></div>
  </aside>
  <main class="app-main">
    <div class="page-heading"><div><p id="pageEyebrow" class="eyebrow">RUANG KAMU</p><h1 id="pageTitle">Dashboard</h1><p id="pageDescription">Pantau saldo dan tugas yang tersedia.</p></div><button id="refreshButton" class="button button-soft" type="button">Muat ulang</button></div>
    <div id="viewRoot" class="view-root" aria-live="polite"></div>
  </main>
</section>

<div id="dialogLayer" class="dialog-layer hidden" role="presentation"></div>
<div id="liveStatus" class="live-status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
